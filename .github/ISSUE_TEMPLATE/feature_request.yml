name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - gguf_lib (LLM)
        - ai_sd (Image Generation)
        - ai_supertonic_tts (TTS)
        - New module
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature and why it would be useful
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any workarounds or alternative approaches you've tried
